<body style="margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#0b0f1a; color:#e6e9ef;">
<div style="display:flex; flex-direction:column; align-items:center; gap:18px; padding:18px;">
    <h2 style="margin:8px 0 0 0; font-weight:600; letter-spacing:.5px;">Pi Camera Controller</h2>

    <div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; justify-content:center; width:100%; max-width:1200px;">
        <div style="background:#0f1526; border:1px solid #1b2340; border-radius:12px; padding:12px; box-shadow: 0 10px 30px rgba(0,0,0,.35);">
            <img src="{{ url_for('video_feed') }}" height="720" width="960" style="display:block; border-radius:8px; border:1px solid #1b2340;" />
        </div>

        <div style="min-width:280px; display:flex; flex-direction:column; gap:12px;">
            <div style="background:#0f1526; border:1px solid #1b2340; border-radius:12px; padding:12px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="opacity:.8; font-size:12px;">Pan</div>
                        <div id="panVal" style="font-weight:600;">0°</div>
                    </div>
                    <div>
                        <div style="opacity:.8; font-size:12px;">Tilt</div>
                        <div id="tiltVal" style="font-weight:600;">0°</div>
                    </div>
                    <button id="centerBtn" style="background:#1b6ef3; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">Center (C)</button>
                </div>
            </div>

            <div style="background:#0f1526; border:1px solid #1b2340; border-radius:12px; padding:12px; display:grid; grid-template-columns:repeat(3, 84px); grid-template-rows: repeat(3, 64px); gap:8px; justify-content:center;">
                <div></div>
                <button data-action="up" class="ctl">↑</button>
                <div></div>
                <button data-action="left" class="ctl">←</button>
                <div></div>
                <button data-action="right" class="ctl">→</button>
                <div></div>
                <button data-action="down" class="ctl">↓</button>
                <div></div>
            </div>

            <div style="opacity:.8; font-size:12px; text-align:center;">Keyboard: arrows to move, C to center. Hold to repeat.</div>
        </div>
    </div>

    <iframe name="iframe-target" id="iframe-target" style="display:none;"></iframe>
</div>

<style>
button.ctl{background:#151c32; color:#e6e9ef; border:1px solid #1b2340; border-radius:10px; font-size:22px; cursor:pointer; transition: all .08s ease;}
button.ctl:hover{background:#182244}
button.ctl:active{transform:scale(0.98)}
#centerBtn:hover{filter:brightness(1.1)}
</style>

<script>
const panVal = document.getElementById('panVal');
const tiltVal = document.getElementById('tiltVal');
const centerBtn = document.getElementById('centerBtn');

let repeatTimer = null;
let repeatPayload = null;

async function fetchState(){
  const r = await fetch('/api/state');
  const j = await r.json();
  panVal.textContent = j.pan + '°';
  tiltVal.textContent = j.tilt + '°';
}

async function control(payload){
  await fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  fetchState();
}

function startRepeat(payload){
  repeatPayload = payload;
  if(repeatTimer) return;
  control(payload);
  repeatTimer = setInterval(()=> control(payload), 100);
}
function stopRepeat(){
  if(repeatTimer){ clearInterval(repeatTimer); repeatTimer=null; }
}

document.querySelectorAll('button.ctl').forEach(btn=>{
  btn.addEventListener('mousedown', ()=>{
    const act = btn.getAttribute('data-action');
    const payload = act==='left'?{deltaPan:-3}:{
      ...(act==='right'?{deltaPan:3}:{})
    };
    if(act==='up') payload.deltaTilt=-3;
    if(act==='down') payload.deltaTilt=3;
    startRepeat(payload);
  });
  btn.addEventListener('mouseup', stopRepeat);
  btn.addEventListener('mouseleave', stopRepeat);
  btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); const act = btn.getAttribute('data-action'); const p={}; if(act==='left')p.deltaPan=-3; if(act==='right')p.deltaPan=3; if(act==='up')p.deltaTilt=-3; if(act==='down')p.deltaTilt=3; startRepeat(p); }, {passive:false});
  btn.addEventListener('touchend', stopRepeat);
});

centerBtn.addEventListener('click', async ()=>{
  await fetch('/api/center', {method:'POST'});
  fetchState();
});

document.addEventListener('keydown', (e)=>{
  if(e.repeat) return;
  if(e.key==='ArrowLeft') startRepeat({deltaPan:-3});
  if(e.key==='ArrowRight') startRepeat({deltaPan:3});
  if(e.key==='ArrowUp') startRepeat({deltaTilt:-3});
  if(e.key==='ArrowDown') startRepeat({deltaTilt:3});
  if(e.key==='c' || e.key==='C') fetch('/api/center', {method:'POST'}).then(fetchState);
});
document.addEventListener('keyup', (e)=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) stopRepeat();
});

fetchState();
setInterval(fetchState, 1000);
</script>
</body>
